<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>台股選股模型</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e5e7eb;--accent:#2563eb;--up:#dc2626;--down:#16a34a;--soft:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:18px 20px 0}
.top{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.5px}
.meta{font-size:12.5px;color:#94a3b8;margin-top:2px}
.pill{font-size:13px;padding:5px 12px;border-radius:999px;background:#1e293b;white-space:nowrap}
.pill b{color:#4ade80}.pill b.mid{color:#fbbf24}.pill b.low{color:#f87171}
.tabs{max-width:1100px;margin:14px auto 0;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;color:#94a3b8;font:inherit;font-size:14px;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-color:#60a5fa}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.page{display:none}.page.on{display:block}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:6px}
.g2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--line)}
.k{font-size:12px;color:var(--sub)}
.v{font-size:24px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.s{font-size:12px;color:var(--sub)}
h2{font-size:15px;font-weight:600;margin:22px 0 10px}
h2:first-child{margin-top:0}
.note{font-size:12.5px;color:var(--sub);margin:-4px 0 10px}
.stock .name{font-size:17px;font-weight:600}
.stock .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-top:6px}
.meter{height:6px;background:#e2e8f0;border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rank{font-size:12px;font-weight:600;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:13px}
th{color:var(--sub);font-weight:500;background:var(--soft);position:sticky;top:0;cursor:pointer;user-select:none}
.l{text-align:left}
tr.w td{background:#fffbeb}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:600px}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:#94a3b8}
.bar{display:inline-block;width:46px;height:5px;background:#e2e8f0;border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.chk .v{font-size:17px}.ok{color:var(--down)}.no{color:var(--up)}
.cbox{position:relative;height:280px}
.list div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list div:last-child{border:0}
footer{text-align:center;font-size:12px;color:var(--sub);padding:10px 0 30px}
</style></head><body>
<header>
 <div class="top">
  <div><h1>台股選股模型</h1><div class="meta" id="meta"></div></div>
  <div class="pill" id="pill"></div>
 </div>
 <nav class="tabs" id="tabs">
  <button class="tab on" data-p="home">總覽</button>
  <button class="tab" data-p="rank">排名</button>
  <button class="tab" data-p="live">成績單</button>
  <button class="tab" data-p="model">模型</button>
  <button class="tab" data-p="stock">個股</button>
 </nav>
</header>
<main>
 <section class="page on" id="p-home">
  <div class="grid g2" id="kpi"></div>
  <h2>關注股票</h2>
  <div class="grid g2" id="watch"></div>
  <div class="two">
   <div><h2>短期最看好</h2><div class="card list" id="topS"></div></div>
   <div><h2>長期最看好</h2><div class="card list" id="topL"></div></div>
  </div>
 </section>

 <section class="page" id="p-rank">
  <div class="tools"><input id="q" placeholder="搜尋代號 / 名稱"><select id="ind"></select></div>
  <div class="tbl"><table id="tbl"></table></div>
 </section>

 <section class="page" id="p-live">
  <h2>每日預測 vs 實際</h2>
  <p class="note">前 <span class="N"></span> 檔在 <span class="H"></span> 個交易日後的表現,和全部平均比較</p>
  <div class="tbl" style="max-height:340px"><table id="liveT"></table></div>
  <h2>歷史回測</h2>
  <div class="card"><div class="cbox"><canvas id="cum"></canvas></div></div>
  <h2>每期超額報酬</h2>
  <div class="card"><div class="cbox" style="height:200px"><canvas id="exc"></canvas></div></div>
 </section>

 <section class="page" id="p-model">
  <div class="grid g2" id="checks"></div>
  <div class="two">
   <div><h2>Rank IC</h2><div class="tbl"><table id="icT"></table></div></div>
   <div><h2>五分組報酬</h2><div class="card"><div class="cbox" style="height:230px"><canvas id="quint"></canvas></div></div></div>
  </div>
  <div class="two">
   <div><h2>回測績效</h2><div class="tbl"><table id="sumT"></table></div></div>
   <div><h2>每年報酬</h2><div class="card"><div class="cbox" style="height:230px"><canvas id="yearly"></canvas></div></div></div>
  </div>
  <h2>重要特徵</h2>
  <div class="card"><div class="cbox" style="height:360px"><canvas id="imp"></canvas></div></div>
 </section>

 <section class="page" id="p-stock">
  <div class="tools"><select id="sel"></select></div>
  <div class="grid g2" id="sinfo" style="margin-bottom:12px"></div>
  <div class="card"><div class="cbox" style="height:320px"><canvas id="sc"></canvas></div></div>
  <p class="note" style="margin-top:10px">藍:模型分數 · 橘:實際表現排名 · 同在 50% 同側即猜對</p>
 </section>
</main>
<footer>分數為未來相對其他股票的排名預測(100% 最看好),非股價預測 · 僅供學習研究,非投資建議</footer>
<script>
const D = __DATA__;
const HAS = typeof Chart !== 'undefined';
if (HAS) { Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.color = '#64748b'; Chart.defaults.borderColor = '#eef0f3'; }
const $ = id => document.getElementById(id);
const pct = v => v == null ? '–' : Math.round(v * 100) + '%';
const sr = v => v == null ? '–' : (v > 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
const cl = v => v == null ? '' : v > 0 ? 'up' : v < 0 ? 'down' : '';
const f = (v, d) => v == null ? '–' : v.toFixed(d);
const bar = v => `<span class="bar"><i style="width:${(v || 0) * 100}%"></i></span>`;
document.querySelectorAll('.H').forEach(e => e.textContent = D.horizon);
document.querySelectorAll('.N').forEach(e => e.textContent = D.topn);

const ic = Object.fromEntries(D.ic.map(r => [r.model, r]));
const lic = D.long_ic ? Object.fromEntries(D.long_ic.map(r => [r.model, r])) : {};
const sm = Object.fromEntries(D.summary.map(r => [r.name, r]));
const E = sm['綜合分數'], A = sm['全部股票平均'];
const q = D.quint, y = D.yearly;
const ups = q.slice(1).filter((v, i) => v != null && q[i] != null && v > q[i]).length;
const yw = y.model.filter((v, i) => v != null && y.all[i] != null && v > y.all[i]).length;
const checks = [
  ['Rank IC > 0.03', (ic['綜合分數'].ric || 0) > 0.03, f(ic['綜合分數'].ric, 3)],
  ['五分組遞增', ups >= 3 && q[4] > q[0], `第5組 ${sr(q[4])} / 第1組 ${sr(q[0])}`],
  ['多數年份勝出', yw > y.years.length / 2, `${yw} / ${y.years.length} 年`],
  ['Sharpe 勝出', (E.sharpe || 0) > (A.sharpe || 0), `${f(E.sharpe, 2)} vs ${f(A.sharpe, 2)}`],
];
const passN = checks.filter(c => c[1]).length;

$('meta').textContent = `資料 ${D.date} · 更新 ${D.generated} · ${D.n} 檔`;
$('pill').innerHTML = `模型健康度 <b class="${passN >= 3 ? '' : passN === 2 ? 'mid' : 'low'}">${passN}/4</b>`;

// 分頁(圖表在第一次打開時才畫)
const drawn = {};
function show(p) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.p === p));
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.id === 'p-' + p));
  if (!drawn[p] && DRAW[p]) { drawn[p] = 1; DRAW[p](); }
  history.replaceState(null, '', '#' + p);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => show(t.dataset.p));
const mk = (id, cfg) => HAS ? new Chart($(id), cfg) : null;
const yPct = { ticks: { callback: v => Math.round(v * 100) + '%' } };

// 總覽
$('kpi').innerHTML = [
  ['Rank IC', f(ic['綜合分數'].ric, 3), '> 0.03 有參考價值'],
  ['回測年化', sr(E.ann), '全部平均 ' + sr(A.ann)],
  ['勝率', pct(E.win), '贏過全部平均的期數'],
  ['實盤紀錄', D.live_win == null ? '累積中' : pct(D.live_win), D.live_n + ' 筆已驗證'],
].map(c => `<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join('');

$('watch').innerHTML = D.today.filter(r => r.watch).sort((a, b) => a.rank - b.rank).map(r => `
 <div class="card stock">
  <div style="display:flex;justify-content:space-between"><span class="k">${r.code} · ${r.ind}</span><span class="rank">#${r.rank}</span></div>
  <div class="name">${r.name}</div>
  <div class="row"><span>短期</span><b style="color:var(--ink)">${pct(r.score)}</b></div><div class="meter"><i style="width:${(r.score || 0) * 100}%"></i></div>
  <div class="row"><span>長期</span><b style="color:var(--ink)">${pct(r.long)}</b></div><div class="meter"><i style="width:${(r.long || 0) * 100}%;background:#7c3aed"></i></div>
  <div class="row"><span>收盤 ${r.close ?? '–'}</span><span>20日 <b class="${cl(r.ret20)}">${sr(r.ret20)}</b></span></div>
 </div>`).join('');

const li = rows => rows.map(r => `<div><span><span class="mut">${r.code}</span> ${r.name}</span><b>${pct(r._s)}</b></div>`).join('');
$('topS').innerHTML = li([...D.today].sort((a, b) => a.rank - b.rank).slice(0, 10).map(r => ({ ...r, _s: r.score })));
$('topL').innerHTML = li([...D.today].filter(r => r.long != null).sort((a, b) => b.long - a.long).slice(0, 10).map(r => ({ ...r, _s: r.long })));

// 排名
$('ind').innerHTML = '<option value="">全部產業</option>' + [...new Set(D.today.map(r => r.ind))].map(i => `<option>${i}</option>`).join('');
const cols = [['rank', '#'], ['code', '代號', 'l'], ['name', '名稱', 'l'], ['ind', '產業', 'l'], ['score', '短期'], ['neutral', '產業中立'],
  ['long', '長期'], ['rev', '營收年增'], ['pe', '本益比'], ['foreign', '外資20日'], ['ret20', '20日漲跌'], ['close', '收盤']];
let sk = 'rank', asc = true;
function drawTbl() {
  const qq = $('q').value.trim(), ind = $('ind').value;
  const rows = D.today.filter(r => (!qq || r.code.includes(qq) || r.name.includes(qq)) && (!ind || r.ind === ind))
    .sort((a, b) => { const x = a[sk], z = b[sk]; if (x == null) return 1; if (z == null) return -1; return (x > z ? 1 : x < z ? -1 : 0) * (asc ? 1 : -1); });
  $('tbl').innerHTML = '<tr>' + cols.map(c => `<th class="${c[2] || ''}" data-k="${c[0]}">${c[1]}${sk === c[0] ? (asc ? ' ↑' : ' ↓') : ''}</th>`).join('') + '</tr>' +
    rows.map(r => `<tr class="${r.watch ? 'w' : ''}"><td class="mut">${r.rank}</td><td class="l">${r.code}</td><td class="l"><b>${r.name}</b></td><td class="l mut">${r.ind}</td>
    <td>${bar(r.score)}${pct(r.score)}</td><td>${pct(r.neutral)}</td><td>${pct(r.long)}</td><td class="${cl(r.rev)}">${sr(r.rev)}</td>
    <td>${r.pe ?? '–'}</td><td class="${cl(r.foreign)}">${r.foreign == null ? '–' : (r.foreign * 100).toFixed(1) + '%'}</td>
    <td class="${cl(r.ret20)}">${sr(r.ret20)}</td><td>${r.close ?? '–'}</td></tr>`).join('');
  $('tbl').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k;
    if (sk === k) asc = !asc; else { sk = k; asc = ['rank', 'code', 'name', 'ind'].includes(k); } drawTbl(); });
}
$('q').oninput = drawTbl; $('ind').onchange = drawTbl; drawTbl();

// 成績單
$('liveT').innerHTML = '<tr><th class="l">預測日</th><th>前' + D.topn + '檔</th><th>全部平均</th><th>超額</th><th class="l">結果</th></tr>' +
  (D.live.length ? D.live.map(r => r.diff == null
    ? `<tr><td class="l">${r.date}</td><td colspan="3" class="mut">—</td><td class="l mut">${r.left} 日後揭曉</td></tr>`
    : `<tr><td class="l">${r.date}</td><td class="${cl(r.top)}">${sr(r.top)}</td><td class="${cl(r.all)}">${sr(r.all)}</td>
       <td class="${cl(r.diff)}"><b>${sr(r.diff)}</b></td><td class="l ${r.diff > 0 ? 'ok' : 'no'}">${r.diff > 0 ? '勝' : '敗'}</td></tr>`).join('')
  : '<tr><td colspan="5" class="mut l">尚無紀錄</td></tr>');

// 模型
$('checks').innerHTML = checks.map(c => `<div class="card chk"><div class="k">${c[0]}</div><div class="v ${c[1] ? 'ok' : 'no'}">${c[1] ? '✓ 通過' : '✕ 未通過'}</div><div class="s">${c[2]}</div></div>`).join('');
$('icT').innerHTML = '<tr><th class="l">模型</th><th>短期</th><th>長期</th><th>IC>0</th></tr>' +
  D.ic.map(r => `<tr><td class="l">${r.model}</td><td><b>${f(r.ric, 3)}</b></td><td>${f((lic[r.model] || {}).ric, 3)}</td><td>${pct(r.pos)}</td></tr>`).join('');
$('sumT').innerHTML = '<tr><th class="l">策略</th><th>年化</th><th>波動</th><th>Sharpe</th></tr>' +
  D.summary.map(r => `<tr><td class="l">${r.name}</td><td class="${cl(r.ann)}">${sr(r.ann)}</td><td>${pct(r.vol)}</td><td><b>${f(r.sharpe, 2)}</b></td></tr>`).join('');

const ZH = { ret_1: '1日報酬', ret_5: '5日報酬', ret_20: '20日報酬', ret_60: '60日報酬', ret_120: '120日報酬', mom_12_1: '一年動能',
  dist_high_250: '距一年高點', gap_ma20: '月線乖離', gap_ma60: '季線乖離', gap_ma120: '半年線乖離', rsi_14: 'RSI', vol_20: '20日波動',
  vol_60: '60日波動', max_ret_20: '20日最大漲幅', skew_60: '報酬偏態', beta_60: 'Beta', log_dollar_vol: '成交金額', volu_ratio: '量比',
  amihud: '流動性', earn_yield: '盈餘殖利率', book_to_price: '淨值股價比', roe_proxy: 'ROE', div_yield: '殖利率',
  foreign_5: '外資5日', foreign_20: '外資20日', trust_5: '投信5日', trust_20: '投信20日', dealer_5: '自營商5日', dealer_20: '自營商20日',
  rev_yoy: '營收年增', rev_yoy_3m: '3月營收年增', rev_mom: '營收月增', rev_vs_high: '營收距高點', rev_yoy_accel: '營收加速',
  eps_yoy: 'EPS年增', gross_margin: '毛利率', gm_chg_yoy: '毛利率變化', op_margin: '營益率', om_chg_yoy: '營益率變化',
  mkt_ret_5: '大盤5日', mkt_ret_20: '大盤20日', mkt_gap_ma60: '大盤季線乖離', mkt_vol_20: '大盤波動', sox_ret_5: '費半5日',
  sox_ret_20: '費半20日', fx_ret_20: '匯率20日' };

const DRAW = {
  live() {
    const B = D.bt;
    mk('cum', { type: 'line', data: { labels: B.dates, datasets: [
      { label: '綜合分數', data: B.ens, borderColor: '#2563eb', borderWidth: 2, pointRadius: 0 },
      { label: '產業中立', data: B.neutral, borderColor: '#7c3aed', borderWidth: 1.5, pointRadius: 0 },
      { label: '全部平均', data: B.all, borderColor: '#94a3b8', borderWidth: 1.5, pointRadius: 0 },
      { label: '加權指數', data: B.market, borderColor: '#f59e0b', borderWidth: 1.5, pointRadius: 0 }] },
      options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } } });
    mk('exc', { type: 'bar', data: { labels: B.dates, datasets: [{ data: B.excess, backgroundColor: B.excess.map(v => v > 0 ? '#dc2626' : '#16a34a') }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => sr(c.raw) } } }, scales: { y: yPct, x: { ticks: { maxTicksLimit: 8 } } } } });
  },
  model() {
    mk('quint', { type: 'bar', data: { labels: ['1 最不看好', '2', '3', '4', '5 最看好'], datasets: [{ data: q, backgroundColor: ['#cbd5e1', '#cbd5e1', '#93c5fd', '#60a5fa', '#2563eb'], borderRadius: 6 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => sr(c.raw) } } }, scales: { y: yPct } } });
    mk('yearly', { type: 'bar', data: { labels: y.years, datasets: [
      { label: '綜合分數', data: y.model, backgroundColor: '#2563eb', borderRadius: 4 },
      { label: '產業中立', data: y.neutral, backgroundColor: '#a78bfa', borderRadius: 4 },
      { label: '全部平均', data: y.all, backgroundColor: '#cbd5e1', borderRadius: 4 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: c => c.dataset.label + ' ' + sr(c.raw) } } }, scales: { y: yPct } } });
    if (D.importance) mk('imp', { type: 'bar', data: { labels: D.importance.names.map(n => ZH[n] || n), datasets: [{ data: D.importance.values, backgroundColor: '#0ea5e9', borderRadius: 4 }] },
      options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false } } } });
  },
  stock() { drawStock(); },
};

// 個股
const sel = $('sel');
const order = D.today.map(r => r.code).filter(c => D.stocks[c]);
Object.keys(D.stocks).forEach(c => { if (!order.includes(c)) order.push(c); });
sel.innerHTML = order.map(c => `<option value="${c}">${c} ${D.stocks[c].name}</option>`).join('');
sel.value = order.includes('2330') ? '2330' : order[0];
let sch = null;
function drawStock() {
  const c = sel.value, s = D.stocks[c], t = D.today.find(r => r.code === c) || {};
  let n = 0, hit = 0;
  s.score.forEach((v, i) => { const a = s.actual[i]; if (v != null && a != null) { n++; if ((v > .5) === (a > .5)) hit++; } });
  $('sinfo').innerHTML = [['今日排名', t.rank ? '#' + t.rank : '–'], ['短期 / 長期', pct(t.score) + ' / ' + pct(t.long)], ['歷史命中率', n ? Math.round(hit / n * 100) + '%' : '–'], ['樣本數', n]]
    .map(x => `<div class="card"><div class="k">${x[0]}</div><div class="v" style="font-size:20px">${x[1]}</div></div>`).join('');
  if (sch) sch.destroy();
  sch = mk('sc', { type: 'line', data: { labels: s.dates, datasets: [
    { label: '模型分數', data: s.score, borderColor: '#2563eb', pointRadius: 2, borderWidth: 1.5, tension: .2 },
    { label: '實際排名', data: s.actual, borderColor: '#f59e0b', pointRadius: 2, borderWidth: 1.5, tension: .2 }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },

}
