name: 每日更新預測

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 台灣時間週一到週五 18:30(GitHub 可能延遲幾十分鐘)
  workflow_dispatch:           # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency: daily-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行模型
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python stock_model.py

      - name: 儲存結果(網站 + 資料快取)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs data || true
          git diff --cached --quiet || git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)"
          git push
