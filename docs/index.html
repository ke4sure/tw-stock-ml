<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>台股選股模型</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e5e7eb;--accent:#2563eb;--up:#dc2626;--down:#16a34a;--soft:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:18px 20px 0}
.top{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.5px}
.meta{font-size:12.5px;color:#94a3b8;margin-top:2px}
.pill{font-size:13px;padding:5px 12px;border-radius:999px;background:#1e293b;white-space:nowrap}
.pill b{color:#4ade80}.pill b.mid{color:#fbbf24}.pill b.low{color:#f87171}
.tabs{max-width:1100px;margin:14px auto 0;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;color:#94a3b8;font:inherit;font-size:14px;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-color:#60a5fa}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.page{display:none}.page.on{display:block}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:6px}
.g2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--line)}
.k{font-size:12px;color:var(--sub)}
.v{font-size:24px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.s{font-size:12px;color:var(--sub)}
h2{font-size:15px;font-weight:600;margin:22px 0 10px}
h2:first-child{margin-top:0}
.note{font-size:12.5px;color:var(--sub);margin:-4px 0 10px}
.stock .name{font-size:17px;font-weight:600}
.stock .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:6px}
.meter{height:6px;background:#e2e8f0;border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rank{font-size:12px;font-weight:600;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-size:13px}
th{color:var(--sub);font-weight:500;background:var(--soft);position:sticky;top:0;cursor:pointer;user-select:none}
.l{text-align:left}
tr.w td{background:#fffbeb}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:600px}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:#94a3b8}
.bar{display:inline-block;width:46px;height:5px;background:#e2e8f0;border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input,select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.chk .v{font-size:17px}.ok{color:var(--down)}.no{color:var(--up)}
.cbox{position:relative;height:280px}
.list div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list div:last-child{border:0}
@media(min-width:900px){#watch{grid-template-columns:repeat(5,1fr)}}
footer{text-align:center;font-size:12px;color:var(--sub);padding:10px 0 30px}
</style></head><body>
<header>
 <div class="top">
  <div><h1>台股選股模型</h1><div class="meta" id="meta"></div></div>
  <div class="pill" id="pill"></div>
 </div>
 <nav class="tabs" id="tabs">
  <button class="tab on" data-p="home">總覽</button>
  <button class="tab" data-p="rank">排名</button>
  <button class="tab" data-p="live">成績單</button>
  <button class="tab" data-p="model">模型</button>
  <button class="tab" data-p="stock">個股</button>
 </nav>
</header>
<main>
 <section class="page on" id="p-home">
  <div class="grid g2" id="kpi"></div>
  <h2>今日前 10 名</h2>
  <div class="grid g2" id="watch"></div>
  <h2>長期最看好</h2>
  <div class="card list" id="topL"></div>
 </section>

 <section class="page" id="p-rank">
  <div class="tools"><input id="q" placeholder="搜尋代號 / 名稱"><select id="ind"></select></div>
  <div class="tbl"><table id="tbl"></table></div>
 </section>

 <section class="page" id="p-live">
  <h2>每日預測 vs 實際</h2>
  <p class="note">前 <span class="N"></span> 檔在 <span class="H"></span> 個交易日後的表現,和全部平均比較</p>
  <div class="tbl" style="max-height:340px"><table id="liveT"></table></div>
  <h2>歷史回測</h2>
  <div class="card"><div class="cbox"><canvas id="cum"></canvas></div></div>
  <h2>每期超額報酬</h2>
  <div class="card"><div class="cbox" style="height:200px"><canvas id="exc"></canvas></div></div>
 </section>

 <section class="page" id="p-model">
  <div class="grid g2" id="checks"></div>
  <div class="two">
   <div><h2>Rank IC</h2><div class="tbl"><table id="icT"></table></div></div>
   <div><h2>五分組報酬</h2><div class="card"><div class="cbox" style="height:230px"><canvas id="quint"></canvas></div></div></div>
  </div>
  <div class="two">
   <div><h2>回測績效</h2><div class="tbl"><table id="sumT"></table></div></div>
   <div><h2>每年報酬</h2><div class="card"><div class="cbox" style="height:230px"><canvas id="yearly"></canvas></div></div></div>
  </div>
  <h2>重要特徵</h2>
  <div class="card"><div class="cbox" style="height:360px"><canvas id="imp"></canvas></div></div>
 </section>

 <section class="page" id="p-stock">
  <div class="tools"><select id="sel"></select></div>
  <div class="grid g2" id="sinfo" style="margin-bottom:12px"></div>
  <div class="card"><div class="cbox" style="height:320px"><canvas id="sc"></canvas></div></div>
  <p class="note" style="margin-top:10px">藍:模型分數 · 橘:實際表現排名 · 同在 50% 同側即猜對</p>
 </section>
</main>
<footer>分數為未來相對其他股票的排名預測(100% 最看好,已扣除產業與 beta 影響),非股價預測 · 僅供學習研究,非投資建議</footer>

  : '<tr><td colspan="5" class="mut l">尚無紀錄</td></tr>');

const ZH = { ret_1: '1日報酬', ret_5: '5日報酬', ret_20: '20日報酬', ret_60: '60日報酬', ret_120: '120日報酬', mom_12_1: '一年動能',

  rev_yoy: '營收年增', rev_yoy_3m: '3月營收年增', rev_mom: '營收月增', rev_vs_high: '營收距高點', rev_yoy_accel: '營收加速',
  eps_yoy: 'EPS年增', gross_margin: '毛利率', gm_chg_yoy: '毛利率變化', op_margin: '營益率', om_chg_yoy: '營益率變化',
  mkt_ret_5: '大盤5日', mkt_ret_20: '大盤20日', mkt_gap_ma60: '大盤季線乖離', mkt_vol_20: '大盤波動', sox_ret_5: '費半5日',
  sox_ret_20: '費半20日', fx_ret_20: '匯率20日' };

const DRAW = {
  live() {
    const B = D.bt;
    mk('cum', { type: 'line', data: { labels: B.dates, datasets: [
      { label: '產業中立(主要)', data: B.neutral, borderColor: '#2563eb', borderWidth: 2, pointRadius: 0 },
      { label: '未中立', data: B.ens, borderColor: '#a78bfa', borderWidth: 1.5, pointRadius: 0 },
      { label: '全部平均', data: B.all, borderColor: '#94a3b8', borderWidth: 1.5, pointRadius: 0 },

      { label: '產業中立', data: y.model, backgroundColor: '#2563eb', borderRadius: 4 },

  stock() { drawStock(); },

// 個股
const sel = $('sel');
const order = D.today.map(r => r.code).filter(c => D.stocks[c]);
Object.keys(D.stocks).forEach(c => { if (!order.includes(c)) order.push(c); });
sel.innerHTML = order.map(c => `<option value="${c}">${c} ${D.stocks[c].name}</option>`).join('');
sel.value = order.includes('2330') ? '2330' : order[0];
let sch = null;
function drawStock() {
  const c = sel.value, s = D.stocks[c], t = D.today.find(r => r.code === c) || {};
  let n = 0, hit = 0;
  s.score.forEach((v, i) => { const a = s.actual[i]; if (v != null && a != null) { n++; if ((v > .5) === (a > .5)) hit++; } });
  $('sinfo').innerHTML = [['今日排名', t.rank ? '#' + t.rank : '–'], ['短期 / 長期', pct(t.score) + ' / ' + pct(t.long)], ['歷史命中率', n ? Math.round(hit / n * 100) + '%' : '–'], ['樣本數', n]]
    .map(x => `<div class="card"><div class="k">${x[0]}</div><div class="v" style="font-size:20px">${x[1]}</div></div>`).join('');
  if (sch) sch.destroy();
  sch = mk('sc', { type: 'line', data: { labels: s.dates, datasets: [
    { label: '模型分數', data: s.score, borderColor: '#2563eb', pointRadius: 2, borderWidth: 1.5, tension: .2 },
    { label: '實際排名', data: s.actual, borderColor: '#f59e0b', pointRadius: 2, borderWidth: 1.5, tension: .2 }] },
    options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { afterBody: it => '實際報酬 ' + sr(s.ret[it[0].dataIndex]) } } },
      scales: { y: { min: 0, max: 1, ticks: { callback: v => v * 100 + '%' } } } } });
}
sel.onchange = drawStock;

const start = (location.hash || '#home').slice(1);
show(DRAW[start] !== undefined || ['home', 'rank'].includes(start) ? start : 'home');
</script></body></html>
